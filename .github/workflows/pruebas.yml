name: pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: ffmpeg y fuentes
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Siempre en modo simulado: las pruebas nunca llaman a APIs de pago.
      - run: pnpm test
