# /etc/nginx/sites-available/guion2video  (enlazar en sites-enabled)
# Crear usuario:  sudo htpasswd -c /etc/nginx/.htpasswd-guion2video TU_USUARIO
server {
    listen 80;
    server_name guion2video.linkeagroup.com;

    # certbot --nginx -d guion2video.linkeagroup.com añadirá aquí el bloque 443 y la redirección.
    client_max_body_size 80m;

    auth_basic "guion2video";
    auth_basic_user_file /etc/nginx/.htpasswd-guion2video;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # progreso en vivo (SSE)
        proxy_read_timeout 3600s;     # renders largos
        proxy_send_timeout 3600s;
    }
}
